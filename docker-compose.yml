version: '3.8'

# Docker Compose configuration for OpsMind AI multi-service orchestration
# Usage: docker-compose up -d
# To stop: docker-compose down
# To view logs: docker-compose logs -f api

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: opsmind-db
    environment:
      # Database credentials (change in production!)
      POSTGRES_DB: ${DB_NAME:-opsmind_ai}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restaurant_ops_2026}
      # PostgreSQL configuration for performance
      POSTGRES_INITDB_ARGS: "-c max_connections=100 -c shared_buffers=256MB"
    
    ports:
      # Expose PostgreSQL port for development/debugging
      - "${DB_PORT:-5432}:5432"
    
    volumes:
      # Persist database data across container restarts
      # Critical for restaurants: data must NOT disappear on restart
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount initialization scripts (SQL files in db/init/)
      # - ./db/init/:/docker-entrypoint-initdb.d
    
    networks:
      - opsmind-network
    
    healthcheck:
      # Check database connectivity every 10 seconds
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-opsmind_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped
    
    environment:
      # Expose database for API service
      PGDATA: /var/lib/postgresql/data/pgdata


  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmind-api
    
    environment:
      # Database Configuration
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-restaurant_ops_2026}@db:5432/${DB_NAME:-opsmind_ai}
      
      # Application Configuration
      APP_NAME: "OpsMind AI"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: "HS256"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000", "http://localhost:3001"]}
      
      # AI Configuration (Google Gemini)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      
      # Server Configuration
      HOST: "0.0.0.0"
      PORT: "8000"
    
    ports:
      # Expose API port for external access
      - "${API_PORT:-8000}:8000"
    
    volumes:
      # Mount source code for hot-reload during development (optional)
      # - .:/app
      # Note: Remove this in production for security
    
    networks:
      - opsmind-network
    
    # Depends on database service being healthy
    depends_on:
      db:
        condition: service_healthy
    
    healthcheck:
      # Check API health endpoint every 30 seconds
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    
    # Forward logs to stdout for docker-compose logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # Optional: Redis Service for Caching (Future addition)
  # redis:
  #   image: redis:7-alpine
  #   container_name: opsmind-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - opsmind-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   restart: unless-stopped


# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local


# Custom network for inter-service communication
networks:
  opsmind-network:
    driver: bridge
