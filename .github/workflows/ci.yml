name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        database: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opsmind_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: opsmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmind_test -d opsmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Hermetic tests never need live AI credentials.
      ENVIRONMENT: development
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+asyncpg://opsmind_test:ci-test-only@localhost:5432/opsmind_test' || '' }}
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (fatal errors only)
        run: |
          # Fail the build on real breakage: syntax errors and undefined names.
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        # `python -m pytest` puts the repo root on sys.path so `import app...`
        # resolves the same way it does when running the suite locally.
        run: python -m pytest -q
