name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      # Keep the config validator in its permissive dev mode (the default secret
      # key is only rejected outside development). No real secrets are needed for
      # the hermetic security suites; AI/LLM tests that call Gemini require the
      # GEMINI_API_KEY repository secret to be set.
      ENVIRONMENT: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (fatal errors only)
        run: |
          # Fail the build on real breakage: syntax errors and undefined names.
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        # `python -m pytest` puts the repo root on sys.path so `import app...`
        # resolves the same way it does when running the suite locally.
        run: python -m pytest -q
